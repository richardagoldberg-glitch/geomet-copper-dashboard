<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geomet — Copper Intelligence</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');
:root{--bg:#0c1118;--sf:#1a2433;--sf2:#273848;--bd:#3a5268;--tx:#e0e6ed;--tm:#9fb3c6;--td:#7490a8;
--g:#2dbe8a;--gd:rgba(45,190,138,.12);--r:#e05565;--rd:rgba(224,85,101,.12);
--y:#dba64a;--yd:rgba(219,166,74,.12);--o:#d9884e;--od:rgba(217,136,78,.12);
--b:#5a9be0;--bdd:rgba(90,155,224,.12);--cu:#c48260;--cg:rgba(196,130,96,.15);
--p:#9580d9;--pd:rgba(149,128,217,.12);--nf:'SF Mono','Menlo','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{font-family:'IBM Plex Sans',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,rgba(212,132,90,.06) 0%,transparent 100%)}
.hdr-l{display:flex;align-items:center;gap:12px}
.logo{height:28px;display:flex;align-items:center}.logo img{height:100%;width:auto}
.hdr-t{font-size:13px;font-weight:300;color:var(--tm)}
.hdr-r{display:flex;align-items:center;gap:14px}
.ri{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--td)}
.sd{width:7px;height:7px;border-radius:50%;background:var(--g);animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
.ch-badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;padding:3px 7px;border-radius:3px;letter-spacing:0.5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.ch-badge.open{background:var(--gd);color:var(--g)}.ch-badge.closed{background:var(--rd);color:var(--r)}.ch-badge.warn{background:var(--yd);color:var(--y)}
.ch-badge.peak{font-size:12px;font-weight:800;min-width:100px;background:var(--gd);color:var(--g);animation:peakPulse 2.5s ease-in-out infinite;padding:4px 10px}
@keyframes peakPulse{0%,100%{box-shadow:0 0 4px rgba(0,229,155,.2)}50%{box-shadow:0 0 12px rgba(0,229,155,.5)}}
.ch-desc{font-size:7px;font-weight:400;opacity:.7;letter-spacing:0;white-space:nowrap}
#peak-banner{display:none;width:100%;text-align:center;padding:4px 0;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,rgba(212,132,90,.18),rgba(212,132,90,.3),rgba(212,132,90,.18));color:var(--cu);border-bottom:1px solid var(--bd)}
#stale-banner{display:none;width:100%;text-align:center;padding:4px 0;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,rgba(255,71,87,.12),rgba(255,71,87,.25),rgba(255,71,87,.12));color:var(--r);border-bottom:1px solid var(--bd)}
/* 5-card layout: 3 columns, Card 5 spans both rows on the right */
.db{display:grid;grid-template-columns:1.1fr 1.1fr 0.9fr;grid-template-rows:auto auto;gap:1px;background:var(--bd);margin:1px;align-items:start}
.np1{grid-column:1;grid-row:1}
.np2{grid-column:2;grid-row:1}
.np3{grid-column:1;grid-row:2}
.np4{grid-column:2;grid-row:2}
.np5{grid-column:3;grid-row:1 / span 2}
.np1 .pl::before,.np2 .pl::before,.np3 .pl::before,.np4 .pl::before,.np5 .pl::before{content:'';width:3px;height:10px;border-radius:1px}
.np1 .pl::before{background:var(--cu)}
.np2 .pl::before{background:var(--g)}
.np3 .pl::before{background:var(--b)}
.np4 .pl::before{background:var(--p)}
.np5 .pl::before{background:var(--o)}
@media(max-width:1400px){.db{grid-template-columns:1fr 1fr}.np5{grid-column:1 / span 2;grid-row:3}}
@media(max-width:1000px){.db{grid-template-columns:1fr}.np1,.np2,.np3,.np4,.np5{grid-column:1;grid-row:auto}}
.pn{background:var(--sf);padding:20px 22px}
.pl{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--td);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.pl::before{content:'';width:3px;height:10px;border-radius:1px}
.pp .pl::before{background:var(--cu)}.tp .pl::before{background:var(--b)}.sp .pl::before{background:var(--y)}
.posp .pl::before{background:var(--g)}.slp .pl::before{background:var(--p)}.sap .pl::before{background:var(--b)}
.dp .pl::before{background:var(--o)}.fwp .pl::before{background:var(--g)}
.pm{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.pv{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;line-height:1;letter-spacing:-1px}
.pu{font-size:11px;color:var(--td)}
.pc{font-family:'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;padding:4px 8px;border-radius:3px}
.pc.up{color:#3dd9a0;background:var(--gd)}.pc.dn{color:#e0606f;background:var(--rd)}
.ps{font-size:11px;color:var(--td);margin-top:2px}
.lr{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--sf2);border-radius:4px;margin-top:8px}
.ll{font-size:10px;color:var(--tm)}.lv{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.spread-note{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--td);opacity:.7;margin-left:4px}
.mc-ctx{display:flex;gap:6px;margin-top:4px}
.mc-ctx-item{flex:1;padding:5px 8px;background:var(--sf2);border-radius:4px;display:flex;justify-content:space-between;align-items:center}
.mc-ctx-l{font-size:9px;color:var(--tm)}.mc-ctx-v{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600}
.mg{display:grid;gap:7px}
.mr{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--sf2);border-radius:4px;border-left:3px solid transparent}
.mr.a{border-left-color:var(--g)}.mr.bl{border-left-color:var(--r)}
.ml{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tm)}
.mv{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.ms{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.ms.a{color:var(--g)}.ms.bl{color:var(--r)}
.mt{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--td);padding:4px 7px;background:var(--sf2);border-radius:3px;display:inline-block}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pk{padding:9px 10px;background:var(--sf2);border-radius:4px}
.pkl{font-size:9px;color:var(--td);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.pkv{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700}
.pkv.pos{color:var(--g)}.pkv.neg{color:var(--r)}
.pks{font-size:9px;color:var(--td);margin-top:2px}
.rs{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}.rs:last-child{border-bottom:none}
.rsl{font-size:11px;color:var(--tm)}.rsv{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
.rbg{height:5px;background:var(--sf2);border-radius:3px;overflow:hidden;margin-top:5px}.rbf{height:100%;border-radius:3px}
.sbar{display:flex;height:18px;border-radius:3px;overflow:hidden;margin:6px 0}.sbp{background:var(--g)}.sbu{background:var(--p)}
.slg{display:flex;gap:10px;margin-top:4px;margin-bottom:10px}
.sli{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--tm)}
.sld{width:6px;height:6px;border-radius:2px}
.dl{display:grid;gap:7px}
.di{padding:9px 10px;background:var(--sf2);border-radius:4px;font-size:12px;line-height:1.4;border-left:3px solid var(--cu);display:flex;align-items:center;justify-content:space-between;gap:8px}
.di-txt{flex:1;min-width:0}
.di-jump{flex-shrink:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px;background:var(--bd);color:var(--tm);font-size:11px;cursor:pointer;transition:background .15s,color .15s}
.di-jump:hover{background:var(--cu);color:var(--tx)}
.di.warn{border-left-color:var(--r);background:rgba(255,71,87,.06)}
.di.fix-good{border-left-color:var(--g);background:rgba(0,229,155,.06)}
.di.fix-bad{border-left-color:var(--r);background:rgba(255,71,87,.06)}
.tl{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:rgba(0,229,155,.06);border:1px dashed rgba(0,229,155,.3);border-radius:4px;margin-bottom:10px}
.tll{font-size:10px;color:var(--g)}.tlv{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--g)}
.nd{color:var(--td);font-style:italic;font-size:11px;padding:12px 0}
.ld{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--td)}
.ls{width:16px;height:16px;border:2px solid var(--bd);border-top-color:var(--cu);border-radius:50%;animation:sp .8s linear infinite;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.s2{grid-column:span 2}
.pn.pp{order:1}.pn.posp{order:2}.pn.slp{order:3}.pn.mkt{order:4}.pn.sap{order:5}.pn.tp{order:6}.pn.ci{order:7}.pn.dip{order:8}.pn.dp{order:9}
.dib{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--sf2);border-radius:4px;margin-bottom:4px;border-left:3px solid var(--bd);font-size:11px;line-height:1.4;color:var(--tm)}
.dib[data-label="PRICE"]{border-left-color:var(--b)}.dib[data-label="FUNDS"]{border-left-color:#a855f7}.dib[data-label="MACRO"]{border-left-color:var(--y)}.dib[data-label="SUPPLY"]{border-left-color:var(--g)}.dib[data-label="OUTLOOK"]{border-left-color:var(--cu)}
.dib-label{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;padding:1px 4px;border-radius:2px;white-space:nowrap;flex-shrink:0}
.dib[data-label="PRICE"] .dib-label{background:rgba(0,136,255,.12);color:var(--b)}.dib[data-label="FUNDS"] .dib-label{background:rgba(168,85,247,.12);color:#a855f7}.dib[data-label="MACRO"] .dib-label{background:rgba(255,165,0,.12);color:var(--y)}.dib[data-label="SUPPLY"] .dib-label{background:rgba(0,229,155,.12);color:var(--g)}.dib[data-label="OUTLOOK"] .dib-label{background:rgba(184,115,51,.12);color:var(--cu)}
.di-headlines{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.di-hl-toggle{font-size:9px;color:var(--td);cursor:pointer;padding:2px 6px;border:1px solid var(--bd);border-radius:3px;background:none;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.di-hl-toggle::after{content:' ▸';font-size:8px;opacity:.5}
.di-hl-toggle.open::after{content:' ▾'}
.di-hl-list{display:none;margin-top:6px}
.di-hl-toggle.open+.di-hl-list{display:block}
.di-hl-item{font-size:10px;color:var(--td);padding:3px 0;border-bottom:1px solid var(--sf2);line-height:1.3}
.di-hl-src{font-size:8px;color:var(--bd);margin-left:4px}
.di-footer{font-size:9px;color:var(--bd);margin-top:8px;text-align:right;font-style:italic}
.cat-row{display:flex;justify-content:space-between;padding:6px 10px;background:var(--sf2);border-radius:4px;margin-bottom:4px;border-left:3px solid transparent}
.cat-row.hot{border-left-color:var(--r);background:rgba(255,71,87,.06)}.cat-row.ok{border-left-color:var(--g)}.cat-row.chill{border-left-color:var(--td)}
.cat-label{font-size:10px;color:var(--tm)}.cat-val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.cat-val.hot{color:var(--r)}.cat-val.ok{color:var(--g)}.cat-val.chill{color:var(--tm)}
.ctx-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--sf2);border-radius:4px;margin-bottom:5px}
.ctx-l{font-size:10px;color:var(--tm)}.ctx-v{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.rng-bar{height:8px;background:var(--sf2);border-radius:4px;position:relative;margin:6px 0}
.rng-fill{position:absolute;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--r),var(--y),var(--g));opacity:.3}
.rng-dot{position:absolute;top:-2px;width:4px;height:12px;background:var(--tx);border-radius:2px;transform:translateX(-50%)}
.rng-labels{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--td)}
.roc-row{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--sf2);border-radius:4px;margin-bottom:4px}
.roc-label{font-size:9px;color:var(--td);width:28px}
.roc-bar-wrap{flex:1;height:6px;background:var(--bd);border-radius:3px;position:relative;overflow:visible}
.roc-bar{height:100%;border-radius:3px;position:absolute;top:0}
.roc-val{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;width:70px;text-align:right}
.streak-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;margin-top:6px}
.streak-badge.up{background:var(--gd);color:var(--g)}.streak-badge.down{background:var(--rd);color:var(--r)}
.sr-row{display:flex;justify-content:space-between;padding:5px 10px;background:var(--sf2);border-radius:4px;margin-bottom:4px;border-left:3px solid transparent}
.sr-row.sup{border-left-color:var(--g)}.sr-row.res{border-left-color:var(--r)}
.sr-level{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.sr-dist{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--td)}
.oi-section{margin-top:10px}
.oi-hdr{font-size:9px;color:var(--cu);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.oi-hdr-sub{font-size:8px;color:var(--td);text-transform:none;letter-spacing:0}
.oi-wall{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;background:var(--sf2);border-radius:4px;margin-bottom:4px;border-left:3px solid transparent}
.oi-wall.put{border-left-color:var(--g)}.oi-wall.call{border-left-color:var(--r)}.oi-wall.pain{border-left-color:var(--cu)}
.oi-strike{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.oi-count{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--td)}
.oi-label{font-size:8px;font-weight:400;color:var(--tm);margin-left:4px}
.oi-pcr{display:flex;justify-content:space-between;padding:5px 10px;background:var(--sf2);border-radius:4px;margin:6px 0 4px}
.oi-pcr-l{font-size:9px;color:var(--tm)}.oi-pcr-v{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600}
.oi-bar-row{display:flex;align-items:center;gap:0;margin-bottom:1px;border-radius:3px;position:relative}
.oi-bar-strike{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--td);width:44px;text-align:center;flex-shrink:0;z-index:2;padding:4px 0}
.oi-bar-left{flex:1;display:flex;justify-content:flex-end;align-items:center;height:22px;position:relative}
.oi-bar-right{flex:1;display:flex;justify-content:flex-start;align-items:center;height:22px;position:relative}
.oi-bar-put{background:var(--g);border-radius:2px 0 0 2px;height:14px;min-width:0;transition:width .3s}
.oi-bar-call{background:var(--r);border-radius:0 2px 2px 0;height:14px;min-width:0;transition:width .3s}
.oi-bar-ct{font-family:'JetBrains Mono',monospace;font-size:7px;flex-shrink:0;padding:0 4px;white-space:nowrap}
.oi-bar-ct.put{color:var(--g)}.oi-bar-ct.call{color:var(--r)}
.oi-bar-legend{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:7px;color:var(--td);margin-bottom:4px;padding:0 2px}
.oi-bar-row.wall-row .oi-bar-strike{color:var(--tx);font-weight:700}
.oi-bar-row.price-row{border:1px solid var(--cu);border-radius:3px}
.oi-bar-row.price-row .oi-bar-strike{color:var(--cu);font-weight:700;font-size:10px}
.oi-footer{font-family:'JetBrains Mono',monospace;font-size:7px;color:var(--td);opacity:.6;margin-top:6px}
.so-section{margin-top:8px;padding:6px 0;border-top:1px solid var(--bd)}
.so-hdr{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1px;margin-bottom:5px;padding:0 2px}
.so-hdr.ship{color:var(--r)}.so-hdr.unship{color:var(--p)}
.so-scroll{max-height:240px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
.so-scroll::-webkit-scrollbar{width:4px}.so-scroll::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.so-row{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--sf2);border-radius:4px;margin-bottom:3px;font-size:10px;border-left:3px solid transparent;min-width:0}
.so-row.shipped{border-left-color:var(--r);background:rgba(255,71,87,.06)}.so-row.unshipped{border-left-color:var(--p);background:rgba(167,139,250,.06)}
.so-cust{flex:1;color:var(--tx);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.so-comm{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tm);width:40px;text-align:center;flex-shrink:0}
.so-lbs{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;width:52px;text-align:right;flex-shrink:0}
.so-basis{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:600;padding:1px 4px;border-radius:2px;letter-spacing:.5px;flex-shrink:0;white-space:nowrap}
.so-basis.comex{background:var(--cg);color:var(--cu)}.so-basis.lme{background:var(--bdd);color:var(--b)}
.so-po{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--tm);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;opacity:.7}
.so-ship{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:600;padding:1px 4px;border-radius:2px;letter-spacing:.5px;flex-shrink:0;white-space:nowrap}.so-ship.urgent{background:rgba(255,71,87,.15);color:var(--r)}.so-ship.soon{background:rgba(255,165,2,.15);color:#ffa502}.so-ship.actual{background:rgba(0,229,155,.12);color:var(--g)}
.so-avail{flex-shrink:0;font-size:8px;width:12px;text-align:center}
.so-avail.live{color:var(--g)}.so-avail.off{color:var(--td)}
.so-price{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;width:56px;text-align:right;flex-shrink:0;color:var(--cu)}
.so-price.locked{color:var(--g);font-weight:500}
.so-price.formula{color:var(--tm);font-weight:500;font-size:9px;width:auto;min-width:56px;white-space:nowrap}
.so-row.priced{border-left-color:var(--g);background:rgba(0,229,155,.04);opacity:.75}
.so-hdr.priced{color:var(--g)}
.so-grp-ctrl{display:flex;gap:2px;margin:6px 0 4px;padding:2px;background:var(--sf2);border-radius:4px}
.so-grp-btn{flex:1;padding:4px 6px;font-family:'IBM Plex Sans',sans-serif;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:transparent;color:var(--tm);border:0;cursor:pointer;border-radius:3px;transition:background .12s,color .12s}
.so-grp-btn:hover{color:var(--t)}
.so-grp-btn.active{background:var(--sf3);color:var(--t);box-shadow:inset 0 0 0 1px var(--bd)}
.so-grp{margin-top:1px}
.so-grp-hdr{display:flex;align-items:center;gap:6px;padding:5px 6px;font-size:9px;cursor:pointer;border-radius:3px;user-select:none}
.so-grp-hdr:hover{background:var(--sf2)}
.so-grp-chev{display:inline-block;width:8px;font-size:8px;color:var(--td);flex-shrink:0}
.so-grp-dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}
.so-grp-name{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--t);letter-spacing:.5px;text-transform:uppercase;font-size:9px}

<script>
function applyTheme(t){if(t==='light')document.body.classList.add('light');else document.body.classList.remove('light');var b=document.getElementById('thm');if(b)b.textContent=t==='light'?'\u2600\uFE0F':'\uD83C\uDF19'}

loadIntel();

function saveIntel(){var ta=document.getElementById('intel-ta');if(!ta)return;var text=ta.value.trim();if(!text)return;

fetch('/api/intel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})}).then(function(r){return r.json()}).then(function(d){window._intelData=d;fd()}).catch(function(){}).finally(function(){if(btn){btn.textContent='SAVE & ANALYZE';btn.disabled=false}})}

function $(id){return document.getElementById(id)}

cmxEl.querySelector('.ch-txt').textContent=cmx.detail;
cmxEl.querySelector('.ch-desc').textContent=cmx.desc||'';}
var pb=$('peak-banner');if(pb)pb.style.display=(m&&m.is_peak)?'block':'none';

var ak=Math.round(avgV/1000)+'K';
var ratio=avgV>0?m.volume/avgV:1;
vb.textContent=vk+' / '+ak+(useParallel?' avg*':' avg');
vb.title=useParallel?'Compared to same day-of-week & hour average':'Compared to 20-day full-session average';
vb.className='ch-badge '+(ratio>1.3?'open':ratio<0.6?'closed':'warn');
vb.style.display='';} else {$('vol-badge').style.display='none';}
if(!m||!s){$('db').innerHTML='<div class="ld">Unable to fetch data.</div>';return}

var _lmeSrc=m.lme_source==='live'?'<span style="font-size:8px;color:#4caf50;margin-left:4px;font-weight:600">\u25CF live</span>':m.lme_source==='projected'?'<span style="font-size:8px;color:var(--y);margin-left:4px;font-weight:600">(est)</span>':'';

var rlc5=crl5.roll_color==='red'?'var(--r)':crl5.roll_color==='orange'?'var(--o)':crl5.roll_color==='yellow'?'var(--y)':'var(--g)';
h+='<div style="padding:6px 8px;background:'+(crl5.roll_color==='green'?'var(--gd)':crl5.roll_color==='yellow'?'var(--yd)':crl5.roll_color==='orange'?'var(--od)':'var(--rd)')+';border-radius:4px;border-left:3px solid '+rlc5+'">';

h+='<div style="font-size:7px;color:var(--td);margin-top:2px">FND = delivery deadline. Traders must roll before this date.</div></div>';
}
h+='</div>'; // end macro pane

// ---- TECHNICAL TAB ----
h+='<div class="np5-pane" id="np5-tech" style="display:'+(_activeTab==='tech'?'block':'none')+'">';
// DMAs
h+='<div class="mg">';
[['50 DMA',m.ma50,s.above_50],['100 DMA',m.ma100,s.above_100],['200 DMA',m.ma200,s.above_200]].forEach(function(x){
var dDist=Math.abs(m.price-x[1]),dPct=x[1]>0?(dDist/x[1]*100):0;
var prox='';
if(dPct<=0.3)prox='<span style="font-family:JetBrains Mono,monospace;font-size:8px;font-weight:700;color:var(--y);background:var(--yd);padding:1px 4px;border-radius:2px;margin-left:4px;animation:peakPulse 2s ease-in-out infinite">AT LEVEL</span>';
else if(dPct<=1)prox='<span style="font-family:JetBrains Mono,monospace;font-size:8px;color:var(--td);margin-left:4px">'+(dDist*100).toFixed(0)+'c</span>';
h+='<div class="mr '+(x[2]?'a':'bl')+'"><span class="ml">'+x[0]+prox+'</span><span class="mv">'+x[1].toFixed(4)+'</span><span class="ms '+(x[2]?'a':'bl')+'">'+(x[2]?'ABOVE':'BELOW')+'</span></div>';});
h+='</div>';
h+='<div style="margin-top:10px"><div class="mt">'+s.trend+' ('+s.trend_strength+')</div> <div class="mt" style="margin-left:3px">'+s.move_type+'</div></div>';
// Support / Resistance
if(m.support_resistance){var sr=m.support_resistance;
var hasNear=(sr.near_resistance&&sr.near_resistance.length)||(sr.near_support&&sr.near_support.length);
var hasMajor=(sr.resistance&&sr.resistance.length)||(sr.support&&sr.support.length);
if(hasNear||hasMajor){
h+='<div style="margin-top:10px">';
if(hasNear){
h+='<div style="font-size:9px;color:var(--td);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px">Near-Term Levels <span style="opacity:0.6">(20d)</span></div>';
if(sr.near_resistance)sr.near_resistance.slice().reverse().forEach(function(rl){h+='<div class="sr-row res"><span class="sr-level" style="color:var(--r)">'+rl.level.toFixed(2)+' R</span><span class="sr-dist">'+(rl.distance*100).toFixed(0)+'c above</span></div>';});
h+='<div class="sr-row" style="border-left-color:var(--cu);background:var(--cg)"><span class="sr-level" style="color:var(--cu)">'+m.price.toFixed(2)+' \u2190 NOW</span><span class="sr-dist"></span></div>';
if(sr.near_support)sr.near_support.forEach(function(sl){h+='<div class="sr-row sup"><span class="sr-level" style="color:var(--g)">'+sl.level.toFixed(2)+' S</span><span class="sr-dist">'+(sl.distance*100).toFixed(0)+'c below</span></div>';});
}
if(hasMajor){
h+='<div style="font-size:9px;color:var(--td);margin:8px 0 5px;text-transform:uppercase;letter-spacing:1px">Major Levels <span style="opacity:0.6">(90d)</span></div>';
if(sr.resistance)sr.resistance.slice().reverse().forEach(function(rl){h+='<div class="sr-row res"><span class="sr-level" style="color:var(--r)">'+rl.level.toFixed(2)+' R</span><span class="sr-dist">'+(rl.distance*100).toFixed(0)+'c above</span></div>';});
if(!hasNear)h+='<div class="sr-row" style="border-left-color:var(--cu);background:var(--cg)"><span class="sr-level" style="color:var(--cu)">'+m.price.toFixed(2)+' \u2190 NOW</span><span class="sr-dist"></span></div>';
if(sr.support)sr.support.forEach(function(sl){h+='<div class="sr-row sup"><span class="sr-level" style="color:var(--g)">'+sl.level.toFixed(2)+' S</span><span class="sr-dist">'+(sl.distance*100).toFixed(0)+'c below</span></div>';});
}
h+='</div>';}}
// Pinned levels
var cLvls5=cfg.custom_levels||[];
if(cLvls5.length>0){
h+='<div style="margin-top:10px"><div style="font-size:9px;color:var(--cu);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px">Pinned Levels</div>';
cLvls5.slice().sort(function(a,b){return b.price-a.price}).forEach(function(lv){
var dist=m.price-lv.price,absDist=Math.abs(dist),dir=dist>=0?'below':'above';
var distPct=lv.price>0?(absDist/lv.price*100):0;
var prox='';
if(distPct<=0.3)prox=' style="animation:peakPulse 2s ease-in-out infinite"';
h+='<div class="sr-row"'+prox+' style="border-left-color:var(--cu);'+(distPct<=0.3?'background:var(--cg)':'')+'">';
h+='<span class="sr-level" style="color:var(--cu)">'+lv.price.toFixed(2)+' <span style="font-size:8px;font-weight:400;color:var(--tm)">'+lv.label+'</span></span>';
h+='<span class="sr-dist">'+(absDist*100).toFixed(0)+'c '+dir+'</span></div>';
});
h+='</div>';}
// Options Positioning
var oi5=d.options_oi;
if(oi5&&oi5.put_wall&&oi5.call_wall){
h+='<div class="oi-section">';
h+='<div class="oi-hdr"><span>Options Positioning</span><span class="oi-hdr-sub">'+oi5.front_month+(oi5.bulletin_date?' \u2014 '+oi5.bulletin_date:'')+'</span></div>';
var pwDist5=m.price-oi5.put_wall.strike,pwDir5=pwDist5>=0?'above':'below',pwAbs5=Math.abs(pwDist5);
var pwPulse5=pwAbs5<=0.03?' style="animation:peakPulse 2s ease-in-out infinite"':'';
h+='<div class="oi-wall put"'+pwPulse5+'><span><span class="oi-strike" style="color:var(--g)">'+oi5.put_wall.strike.toFixed(2)+'</span><span class="oi-label">PUT WALL</span></span>';
h+='<span class="oi-count">'+(oi5.put_wall.oi).toLocaleString()+' cts \u2014 '+(pwAbs5*100).toFixed(0)+'c '+pwDir5+'</span></div>';
if(oi5.max_pain){
var mpDist5=m.price-oi5.max_pain.strike,mpDir5=mpDist5>=0?'above':'below',mpAbs5=Math.abs(mpDist5);
h+='<div class="oi-wall pain"><span><span class="oi-strike" style="color:var(--cu)">'+oi5.max_pain.strike.toFixed(2)+'</span><span class="oi-label">MAX PAIN</span></span>';
h+='<span class="oi-count">expiry magnet \u2014 '+(mpAbs5*100).toFixed(0)+'c '+mpDir5+'</span></div>';
}
var cwDist5=oi5.call_wall.strike-m.price,cwDir5=cwDist5>=0?'above':'below',cwAbs5=Math.abs(cwDist5);
var cwPulse5=cwAbs5<=0.03?' style="animation:peakPulse 2s ease-in-out infinite"':'';
h+='<div class="oi-wall call"'+cwPulse5+'><span><span class="oi-strike" style="color:var(--r)">'+oi5.call_wall.strike.toFixed(2)+'</span><span class="oi-label">CALL WALL</span></span>';
h+='<span class="oi-count">'+(oi5.call_wall.oi).toLocaleString()+' cts \u2014 '+(cwAbs5*100).toFixed(0)+'c '+cwDir5+'</span></div>';
if(oi5.pc_ratio!==null){
var pcClr5=oi5.pc_ratio>1.2?'var(--g)':oi5.pc_ratio<0.8?'var(--r)':'var(--tx)';
var pcLabel5=oi5.pc_ratio>1.5?'heavy put hedging':oi5.pc_ratio>1.2?'put-heavy (bullish floor)':oi5.pc_ratio<0.7?'call-heavy (bullish bets)':oi5.pc_ratio<0.9?'slight call lean':'balanced';
h+='<div class="oi-pcr"><span class="oi-pcr-l">P/C Ratio</span><span class="oi-pcr-v" style="color:'+pcClr5+'">'+oi5.pc_ratio.toFixed(2)+' \u2014 '+pcLabel5+'</span></div>';
}
// Zoomed OI bar chart — ±40c around current price, every 10c, with heatmap
if(oi5.buckets&&oi5.buckets.length>0){
var pSnap=Math.round(m.price*10)/10;
var zLo=pSnap-0.40,zHi=pSnap+0.40;
var zData=oi5.buckets.filter(function(b){return b.strike>=zLo-0.01&&b.strike<=zHi+0.01;});
var zFilled=[];
for(var tick=zLo;tick<=zHi+0.001;tick=Math.round((tick+0.1)*100)/100){
var found=null;
for(var j=0;j<zData.length;j++){if(Math.abs(zData[j].strike-tick)<0.005){found=zData[j];break;}}
zFilled.push(found||{strike:tick,call_oi:0,put_oi:0,total_oi:0});
}
var zMax=0;zFilled.forEach(function(b){zMax=Math.max(zMax,b.put_oi,b.call_oi);});
h+='<div style="margin-top:10px">';
h+='<div style="font-size:8px;color:var(--td);margin-bottom:2px;display:flex;justify-content:space-between"><span>Where the big money is positioned near price</span></div>';
h+='<div class="oi-bar-legend"><span style="color:var(--g)">SUPPORT \u25C0 puts</span><span style="color:var(--r)">calls \u25B6 RESISTANCE</span></div>';
zFilled.forEach(function(b){
var pW=zMax>0?Math.max(b.put_oi>0?3:0,b.put_oi/zMax*100):0;
var cW=zMax>0?Math.max(b.call_oi>0?3:0,b.call_oi/zMax*100):0;
var isPrice=Math.abs(b.strike-m.price)<0.05;
var isPW=oi5.put_wall&&Math.abs(b.strike-oi5.put_wall.strike)<0.05;
var isCW=oi5.call_wall&&Math.abs(b.strike-oi5.call_wall.strike)<0.05;
var isMP=oi5.max_pain&&Math.abs(b.strike-oi5.max_pain.strike)<0.05;
var rowCls='oi-bar-row';
if(isPrice)rowCls+=' price-row';
else if(isPW||isCW)rowCls+=' wall-row';
var marker='';
if(isPrice)marker=' \u25C0';
else if(isPW)marker=' S';
else if(isCW)marker=' R';
else if(isMP)marker=' \u25CF';
var totalOi=b.put_oi+b.call_oi;
var heat=zMax>0?Math.min(1,totalOi/(zMax*1.2)):0;
var pRatio=totalOi>0?b.put_oi/totalOi:0.5;
var gA=heat*0.12*pRatio;
var rA=heat*0.12*(1-pRatio);
var bgStyle='background:linear-gradient(90deg,rgba(45,190,138,'+gA.toFixed(3)+'),rgba(45,190,138,'+(gA*0.3).toFixed(3)+') 48%,rgba(224,85,101,'+(rA*0.3).toFixed(3)+') 52%,rgba(224,85,101,'+rA.toFixed(3)+'))';
var pLabel=b.put_oi>0?'<span class="oi-bar-ct put">'+b.put_oi.toLocaleString()+'</span>':'';
var cLabel=b.call_oi>0?'<span class="oi-bar-ct call">'+b.call_oi.toLocaleString()+'</span>':'';
h+='<div class="'+rowCls+'" style="'+bgStyle+'">';
h+='<div class="oi-bar-left">'+pLabel+'<div class="oi-bar-put" style="width:'+pW+'%"></div></div>';
h+='<span class="oi-bar-strike">'+b.strike.toFixed(2)+marker+'</span>';
h+='<div class="oi-bar-right"><div class="oi-bar-call" style="width:'+cW+'%"></div>'+cLabel+'</div>';
h+='</div>';
});
h+='</div>';
}
h+='<div class="oi-footer">CME Daily Bulletin \u2014 updated after midnight CT</div>';
h+='</div>';
}
// Momentum (ROC)
if(m.roc){h+='<div style="margin-top:10px"><div class="ctx-l" style="margin-bottom:5px">Momentum</div>';
['1d','3d','5d','10d'].forEach(function(k){if(!m.roc[k])return;var v=m.roc[k];
var clr=v.change>=0?'var(--g)':'var(--r)';var w=Math.min(Math.abs(v.pct)*10,50);
h+='<div class="roc-row"><span class="roc-label">'+k+'</span><div class="roc-bar-wrap"><div class="roc-bar" style="width:'+w+'%;background:'+clr+';'+(v.change<0?'right:50%;':'left:50%')+'"></div></div>';
h+='<span class="roc-val" style="color:'+clr+'">'+(v.change>=0?'+':'')+v.change.toFixed(2)+' ('+v.pct+'%)</span></div>';});
h+='</div>';}
h+='</div>'; // end tech pane
h+='</div>'; // end Card 5
$('db').innerHTML=h;
}
// --- Level crossing alerts (DMA + S/R) ---
var _lvlPrev=null,_lvlNotified={};
if('Notification' in window&&Notification.permission==='default'){Notification.requestPermission();}
function checkLevelAlerts(m,s,cfg,d){
if(!m||!m.price)return;
var p=m.price,prev=_lvlPrev;_lvlPrev=p;
if(prev===null)return;// first load, no comparison
var levels=[];
// DMAs
if(m.ma50)levels.push({name:'50 DMA',val:m.ma50});
if(m.ma100)levels.push({name:'100 DMA',val:m.ma100});
if(m.ma200)levels.push({name:'200 DMA',val:m.ma200});
// Custom pinned levels
var cl=(cfg&&cfg.custom_levels)||[];
cl.forEach(function(lv){levels.push({name:lv.label||('Level '+lv.price.toFixed(2)),val:lv.price});});
// S/R levels
var sr=m.support_resistance;
if(sr){
if(sr.near_support)sr.near_support.forEach(function(l){levels.push({name:'Support '+l.level.toFixed(2),val:l.level});});
if(sr.near_resistance)sr.near_resistance.forEach(function(l){levels.push({name:'Resistance '+l.level.toFixed(2),val:l.level});});
if(sr.support)sr.support.forEach(function(l){levels.push({name:'Major Support '+l.level.toFixed(2),val:l.level});});
if(sr.resistance)sr.resistance.forEach(function(l){levels.push({name:'Major Resistance '+l.level.toFixed(2),val:l.level});});
}
// Options OI walls
var oi=d&&d.options_oi;
if(oi){
if(oi.put_wall)levels.push({name:'Put Wall '+oi.put_wall.strike.toFixed(2),val:oi.put_wall.strike});
if(oi.call_wall)levels.push({name:'Call Wall '+oi.call_wall.strike.toFixed(2),val:oi.call_wall.strike});
if(oi.max_pain)levels.push({name:'Max Pain '+oi.max_pain.strike.toFixed(2),val:oi.max_pain.strike});
}
levels.forEach(function(lv){
var crossed=false,dir='';
if(prev>lv.val&&p<=lv.val){crossed=true;dir='broke below';}
else if(prev<lv.val&&p>=lv.val){crossed=true;dir='broke above';}
if(!crossed)return;
var key=lv.name+'_'+dir;
var now=Date.now();
// Don't re-alert same crossing within 30 min
if(_lvlNotified[key]&&(now-_lvlNotified[key])<1800000)return;
_lvlNotified[key]=now;
if('Notification' in window&&Notification.permission==='granted'){
new Notification('LEVEL CROSS \u2014 '+lv.name,{
body:'COMEX '+dir+' '+lv.name+' ($'+lv.val.toFixed(4)+') \u2014 now $'+p.toFixed(4),
icon:'/logo.png',tag:'lvl-'+key
});}
});
// Also alert when approaching key levels (within 3c)
levels.forEach(function(lv){
var dist=Math.abs(p-lv.val);
if(dist>0.005&&dist<=0.03){
var key='near_'+lv.name;var now=Date.now();
if(_lvlNotified[key]&&(now-_lvlNotified[key])<3600000)return;// once per hour
_lvlNotified[key]=now;
if('Notification' in window&&Notification.permission==='granted'){
new Notification('APPROACHING '+lv.name,{
body:'COMEX at $'+p.toFixed(4)+' \u2014 '+(dist*100).toFixed(0)+'c from '+lv.name+' ($'+lv.val.toFixed(4)+')',
icon:'/logo.png',tag:'near-'+key
});}}
});
}
fd();setInterval(fd,60000);setInterval(syncTheme,60000);
</script>
